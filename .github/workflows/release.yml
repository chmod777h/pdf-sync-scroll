name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== require('./manifest.json').version) process.exit(1)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/main.js dist/manifest.json dist/styles.css artifacts/SHA256SUMS.txt --draft --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md
